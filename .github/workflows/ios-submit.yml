name: Prepare and Submit iOS Build

# Pulls the current in-review version, attaches the specified build, and
# submits it. Runs on Linux; no macOS minutes are consumed.

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID'
        type: string
        default: 'com.revisitedlabs.nongram'
      version_name:
        description: 'Marketing version'
        type: string
        default: '1.0'
      build_number:
        description: 'iOS build number to attach'
        type: string
        required: true
        default: '2'
      remove_in_review:
        description: 'Remove the current version from review before submitting'
        type: boolean
        default: true
      release_notes:
        description: "What's New text (empty keeps the existing notes)"
        type: string
        required: false
        default: ''
      inspect:
        description: 'List versions/builds only; make no changes'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-submit-${{ inputs.version_name }}-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install --quiet pyjwt cryptography requests

      - name: Prepare App Store Connect key
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_BASE64" ]; then
            echo "::error::Missing APP_STORE_CONNECT_API_KEY_BASE64 secret."
            exit 1
          fi
          echo -n "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Prepare and submit
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUNDLE_ID: ${{ inputs.bundle_id }}
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          REMOVE_IN_REVIEW: ${{ inputs.remove_in_review }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          INSPECT: ${{ inputs.inspect }}
        run: |
          args=(--version-name "$VERSION_NAME" --build-number "$BUILD_NUMBER")
          if [ "$REMOVE_IN_REVIEW" = "true" ]; then
            args+=(--remove-in-review)
          fi
          if [ -n "$RELEASE_NOTES" ]; then
            args+=(--release-notes "$RELEASE_NOTES")
          fi
          if [ "$INSPECT" = "true" ]; then
            args+=(--inspect)
          fi
          python .github/scripts/ios_submit.py "${args[@]}"
