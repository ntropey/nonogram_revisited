name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The website tests check the copied /play/ build, so the app must be built first.
      - run: pnpm --filter @nonogram/app build
      - run: pnpm test
      - run: pnpm --filter @nonogram/website build
      - run: pnpm --filter @nonogram/website test
