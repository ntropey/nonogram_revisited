name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: 'Put the temporary password gate on the site (needs the SITE_PASSWORD secret)'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nonogram/app build
      - name: Require the password secret when gating
        if: ${{ inputs.gate && env.SITE_PASSWORD == '' }}
        run: echo "Add the SITE_PASSWORD repository secret, or untick 'gate'." && exit 1
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - name: Website tests
        run: pnpm --filter @nonogram/website build && pnpm --filter @nonogram/website test
        env:
          SITE_URL: https://nonogramrevisited.com/
      - run: pnpm --filter @nonogram/website build
        env:
          SITE_URL: https://nonogramrevisited.com/
          SITE_PASSWORD: ${{ inputs.gate && secrets.SITE_PASSWORD || '' }}
      - name: Ensure Cloudflare Pages project exists
        if: ${{ env.CF_TOKEN != '' }}
        run: npx --yes wrangler pages project create nonogram-revisited --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c9d1596276c79e822640d0a8d429c60
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c9d1596276c79e822640d0a8d429c60
          command: pages deploy packages/website/dist --project-name=nonogram-revisited --branch=main
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/website/dist
      - id: deployment
        uses: actions/deploy-pages@v5
